<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Research Assistant</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1>News Research Assistant</h1>
        <p class="intro">Search recent news, review FX movements, and analyze implications for your situation.</p>

        <div class="form-grid">
          <div class="form-group">
            <label for="sector">Sector</label>
            <select id="sector">
              <option value="">Select a sector</option>
            </select>
          </div>

          <div class="form-group">
            <label for="subsector">Subsector</label>
            <select id="subsector" disabled>
              <option value="">Select a sector first</option>
            </select>
          </div>

          <div class="form-group">
            <label for="timeframe">Timeframe</label>
            <select id="timeframe">
              <option value="30">Last 30 days</option>
              <option value="60">Last 60 days</option>
              <option value="90">Last 90 days</option>
              <option value="180">Last 180 days</option>
              <option value="360">Last 360 days</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Currencies</label>
          <div class="checkbox-row">
            <label><input type="checkbox" name="currency" value="THB" checked> THB</label>
            <label><input type="checkbox" name="currency" value="USD"> USD</label>
            <label><input type="checkbox" name="currency" value="JPY"> JPY</label>
            <label><input type="checkbox" name="currency" value="EUR"> EUR</label>
            <label><input type="checkbox" name="currency" value="CNY"> CNY</label>
          </div>
        </div>

        <div class="form-group">
          <label for="topic">Topic / company / issue</label>
          <input id="topic" type="text" placeholder="Example: AI regulation in Thai financial institutions">
        </div>

        <div class="form-group">
          <label for="situation">Your situation / context</label>
          <textarea id="situation" placeholder="Example: I sell compliance software to Thai banks and want to understand what affects customer conversations."></textarea>
        </div>

        <div class="form-group">
          <label for="prompt">What do you want the analysis to focus on?</label>
          <textarea id="prompt" placeholder="Example: Summarize the most relevant developments and explain commercial implications."></textarea>
        </div>

        <button id="send">Research</button>

        <div class="results-stack">
          <div class="result-card">
            <h2>FX Rates</h2>
            <div id="fxOutput">FX rates will appear here.</div>
          </div>

          <div class="result-card">
            <h2>Analysis</h2>
            <div id="analysisOutput">The analysis will appear here.</div>
          </div>

          <div class="result-card">
            <h2>Sources</h2>
            <div id="sourcesOutput">The source links will appear here.</div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
