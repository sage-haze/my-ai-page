<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation builder</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1>Conversation builder</h1>
        <p class="intro">Build a news-informed customer conversation brief.</p>

        <div class="form-grid">
          <div class="form-group">
            <label for="sector">Sector</label>
            <select id="sector">
              <option value="">Select a sector</option>
            </select>
          </div>

          <div class="form-group">
            <label for="subsector">Subsector</label>
            <select id="subsector" disabled>
              <option value="">Select a sector first</option>
            </select>
          </div>

          <div class="form-group">
            <label for="timeframe">Timeframe</label>
            <select id="timeframe">
              <option value="30">Last 30 days</option>
              <option value="60">Last 60 days</option>
              <option value="90">Last 90 days</option>
              <option value="180">Last 180 days</option>
              <option value="360">Last 360 days</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Currencies</label>
          <div class="checkbox-row">
            <label><input type="checkbox" name="currency" value="THB" checked> THB</label>
            <label><input type="checkbox" name="currency" value="USD"> USD</label>
            <label><input type="checkbox" name="currency" value="JPY"> JPY</label>
            <label><input type="checkbox" name="currency" value="EUR"> EUR</label>
            <label><input type="checkbox" name="currency" value="CNY"> CNY</label>
          </div>
        </div>

        <div class="form-group">
          <label>Countries / markets relevant to the client</label>
          <div class="country-picker">
            <input
              id="countrySearch"
              type="text"
              placeholder="Search and select countries..."
              autocomplete="off"
            >
            <div id="countryDropdown" class="country-dropdown hidden"></div>
          </div>
          <div id="selectedCountries" class="selected-country-row"></div>
        </div>

        <div class="form-group">
          <label for="defaultPrompt">Default Prompt</label>
          <textarea id="defaultPrompt" rows="6">You are a relationship manager for a Thailand-based bank speaking with a corporate customer. Based on recent news and the customer profile, suggest 3-5 conversation themes that are relevant to trade finance. Focus on import/export activity, supply chain shifts, FX exposure, working capital needs, payment risk, documentary trade, guarantees, and opportunities for trade finance solutions.</textarea>
        </div>

        <button id="send">Research</button>

        <div class="results-stack">
          <div class="result-card">
            <h2>FX Rates</h2>
            <div id="fxOutput">FX rates will appear here.</div>
          </div>

          <div class="result-card">
            <h2>Analysis</h2>
            <div id="analysisOutput">The analysis will appear here.</div>
          </div>

          <div class="result-card">
            <h2>Sources</h2>
            <div id="sourcesOutput">The source links will appear here.</div>
          </div>
        </div>
      </div>
    </div>

    <script src="sector-data.js"></script>
    <script src="country-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
