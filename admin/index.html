<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Research Audit</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#102a43; background:#f5f8fb; }
    * { box-sizing:border-box; }
    body { margin:0; }
    .wrap { max-width:1280px; margin:0 auto; padding:24px; }
    h1 { margin:0 0 4px; font-size:24px; }
    .sub { color:#627d98; margin-bottom:18px; font-size:13px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    input, select, button { font:inherit; border:1px solid #bcccdc; border-radius:7px; background:#fff; padding:8px 10px; }
    button { cursor:pointer; font-weight:650; }
    .grid { display:grid; grid-template-columns:minmax(320px,.8fr) minmax(0,1.6fr); gap:14px; align-items:start; }
    .panel { background:#fff; border:1px solid #d9e2ec; border-radius:10px; overflow:hidden; }
    .panel-title { padding:11px 13px; border-bottom:1px solid #e8eef4; font-size:13px; font-weight:750; }
    .runs { max-height:76vh; overflow:auto; }
    .run { padding:10px 13px; border-bottom:1px solid #eef2f6; cursor:pointer; }
    .run:hover, .run.active { background:#f0f7ff; }
    .run-head { display:flex; gap:8px; justify-content:space-between; font-size:12px; font-weight:700; }
    .run-meta { margin-top:4px; color:#627d98; font-size:11px; line-height:1.4; }
    .status { font-size:10px; padding:2px 6px; border-radius:999px; background:#edf2f7; }
    .status.COMPLETED { background:#e7f6ef; color:#246b50; }
    .status.ERROR { background:#fdecec; color:#9b2c2c; }
    .detail { padding:14px; min-height:340px; }
    .empty { color:#829ab1; font-size:13px; padding:16px; }
    .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-bottom:12px; }
    .metric { border:1px solid #e1e9f0; border-radius:8px; padding:8px 10px; }
    .metric b { display:block; font-size:11px; color:#627d98; margin-bottom:3px; }
    .metric span { font-size:12px; }
    details { border-top:1px solid #e8eef4; padding:10px 0; }
    summary { cursor:pointer; font-weight:750; font-size:13px; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#f7fafc; border:1px solid #e5edf4; border-radius:8px; padding:10px; font-size:11px; line-height:1.45; max-height:420px; overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:11px; margin-top:8px; }
    th, td { text-align:left; vertical-align:top; border-bottom:1px solid #edf2f7; padding:6px; }
    th { color:#486581; font-size:10px; text-transform:uppercase; letter-spacing:.02em; }
    a { color:#1769aa; }
    .error { color:#9b2c2c; background:#fff5f5; padding:10px; border-radius:8px; }
    @media (max-width:900px) { .grid { grid-template-columns:1fr; } .runs { max-height:40vh; } }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Research Audit</h1>
  <div class="sub">Inspect search queries, Tavily retrieval, source ratings, atomic facts, trade-flow checks, final signals and latency by run.</div>
  <div class="toolbar">
    <input id="isic" placeholder="ISIC code" />
    <select id="status"><option value="">All statuses</option><option>COMPLETED</option><option>ERROR</option><option>RUNNING</option></select>
    <button id="refresh">Refresh</button>
    <input id="runLookup" placeholder="Run ID" style="min-width:230px" />
    <button id="openRun">Open run</button>
  </div>
  <div class="grid">
    <section class="panel">
      <div class="panel-title">Recent runs</div>
      <div class="runs" id="runs"><div class="empty">Loading…</div></div>
    </section>
    <section class="panel">
      <div class="panel-title">Run detail</div>
      <div class="detail" id="detail"><div class="empty">Select a run.</div></div>
    </section>
  </div>
</div>
<script>
const runsEl=document.getElementById('runs');
const detailEl=document.getElementById('detail');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=o=>JSON.stringify(o??{},null,2);
const fmtMs=n=>Number.isFinite(Number(n))?`${(Number(n)/1000).toFixed(2)}s`:'—';
const fmtDate=v=>v?new Date(v).toLocaleString():'—';

async function api(params={}){
  const u=new URL('/admin/api/audit',location.origin);
  Object.entries(params).forEach(([k,v])=>{ if(v!==''&&v!=null)u.searchParams.set(k,v); });
  const r=await fetch(u,{headers:{'Accept':'application/json'},cache:'no-store'});
  const d=await r.json().catch(()=>({error:`HTTP ${r.status}`}));
  if(!r.ok) throw new Error(d.error||`HTTP ${r.status}`);
  return d;
}

async function loadRuns(){
  runsEl.innerHTML='<div class="empty">Loading…</div>';
  try{
    const d=await api({limit:50,status:document.getElementById('status').value,isicCode:document.getElementById('isic').value.trim()});
    const runs=d.runs||[];
    if(!runs.length){runsEl.innerHTML='<div class="empty">No runs found.</div>';return;}
    runsEl.innerHTML=runs.map(r=>`<div class="run" data-run="${esc(r.runId)}"><div class="run-head"><span>${esc(r.runId)}</span><span class="status ${esc(r.status)}">${esc(r.status)}</span></div><div class="run-meta">${esc(r.isicCode||'')} ${esc(r.industry||'')}<br>${esc(fmtDate(r.startedAt))} · ${esc(fmtMs(r.totalMs))}</div></div>`).join('');
    runsEl.querySelectorAll('.run').forEach(el=>el.addEventListener('click',()=>openRun(el.dataset.run)));
  }catch(e){runsEl.innerHTML=`<div class="error">${esc(e.message)}</div>`;}
}

function sourceReviewTable(reviews=[]){
  if(!reviews.length)return '<div class="empty">No source-review records.</div>';
  return `<table><thead><tr><th>#</th><th>Source</th><th>Rating</th><th>Type</th><th>Kept</th><th>Reason</th></tr></thead><tbody>${reviews.map(r=>`<tr><td>${esc(r.number)}</td><td><a href="${esc(r.url||'#')}" target="_blank" rel="noopener">${esc(r.title||r.domain)}</a><br>${esc(r.domain||'')} · Tavily ${esc(Number(r.tavilyScore||0).toFixed(3))}</td><td>${esc(r.relevanceLevel)}</td><td>${esc(r.contentType)}</td><td>${r.kept?'Yes':'No'}</td><td>${esc(r.justification||'')}</td></tr>`).join('')}</tbody></table>`;
}

function factTable(audit={}){
  const extracted=audit.atomicFacts?.extracted||[];
  const kept=new Set((audit.atomicFacts?.retainedAfterTradeFlowCheck||[]).map(f=>f.factId));
  if(!extracted.length)return '<div class="empty">No atomic facts extracted.</div>';
  return `<table><thead><tr><th>Fact</th><th>Geography / period</th><th>Product/topic</th><th>Flow check</th></tr></thead><tbody>${extracted.map(f=>`<tr><td><b>${esc(f.factId)}</b><br>${esc(f.fact)}</td><td>${esc(f.geography)} (${esc(f.geographyScope)})<br>${esc(f.period)}</td><td>${esc(f.productOrTopic)}</td><td>${kept.has(f.factId)?'Kept':'Rejected'}</td></tr>`).join('')}</tbody></table>`;
}

async function openRun(runId){
  detailEl.innerHTML='<div class="empty">Loading run…</div>';
  document.querySelectorAll('.run').forEach(x=>x.classList.toggle('active',x.dataset.run===runId));
  try{
    const d=await api({runId}); const r=d.run; const a=r.audit||{};
    const timings=a.timings||{};
    detailEl.innerHTML=`
      <div class="summary">
        <div class="metric"><b>Run</b><span>${esc(r.runId)}</span></div>
        <div class="metric"><b>Status</b><span>${esc(r.status)}</span></div>
        <div class="metric"><b>Started</b><span>${esc(fmtDate(r.startedAt))}</span></div>
        <div class="metric"><b>Total time</b><span>${esc(fmtMs(r.totalMs))}</span></div>
      </div>
      ${r.error?`<div class="error">${esc(r.error)}</div>`:''}
      <details open><summary>Input</summary><pre>${esc(pretty(r.input))}</pre></details>
      <details open><summary>Stage timings</summary><pre>${esc(pretty(timings))}</pre></details>
      <details><summary>Search plan (${esc((a.searchPlan?.queries||[]).length)})</summary><pre>${esc(pretty(a.searchPlan||{}))}</pre></details>
      <details><summary>Tavily retrieval</summary><pre>${esc(pretty(a.tavily||{}))}</pre></details>
      <details open><summary>Source relevance review (${esc((a.sourceReview?.reviews||[]).length)})</summary>${sourceReviewTable(a.sourceReview?.reviews||[])}</details>
      <details open><summary>Atomic facts</summary>${factTable(a)}</details>
      <details><summary>Final signal selection</summary><pre>${esc(pretty(a.finalSelection||{}))}</pre></details>
      <details><summary>Public result</summary><pre>${esc(pretty(r.result||{}))}</pre></details>`;
  }catch(e){detailEl.innerHTML=`<div class="error">${esc(e.message)}</div>`;}
}

document.getElementById('refresh').addEventListener('click',loadRuns);
document.getElementById('openRun').addEventListener('click',()=>{const id=document.getElementById('runLookup').value.trim();if(id)openRun(id);});
document.getElementById('runLookup').addEventListener('keydown',e=>{if(e.key==='Enter'){const id=e.target.value.trim();if(id)openRun(id);}});
loadRuns();
</script>
</body>
</html>
